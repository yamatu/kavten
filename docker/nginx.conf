# Edge nginx for the compose stack (`--profile internal-nginx`, published on NGINX_PORT).
#
# Two rules drive this file:
#   1. The app owns compression. frontend/brotli-proxy.mjs already answers with
#      Content-Encoding: br (or gzip) when the client asks for it, so nginx must
#      never re-compress nor strip that header. gzip is therefore off here.
#   2. kavten.com is canonical and www is a redirect. The app emits
#      <link rel="canonical" href="https://kavten.com/...">, so the edge must not
#      send www.kavten.com to 200 - that would make canonical != final URL.
#
# TLS is expected to terminate in front of this (host nginx / LB / CDN); see
# nginx.conf in the repository root for the bare-metal TLS variant.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 1100m;

    log_format edge '$remote_addr "$request" $status $body_bytes_sent '
                    'enc=$http_accept_encoding upstream_enc=$sent_http_content_encoding '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log edge;
    error_log  /var/log/nginx/error.log warn;

    # Compression stays in the application (brotli, then gzip fallback).
    # Turning it on here would either duplicate work or fight the upstream
    # Content-Encoding header.
    gzip off;

    # Preserve whatever protocol the TLS terminator reported, otherwise report
    # the scheme this listener saw. Without this the app cannot tell http from
    # https and may emit insecure or Secure-only cookies in the wrong context.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream kavten_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream kavten_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name kavten.com www.kavten.com _;

        # www -> apex, permanently. Matches the canonical the app emits.
        if ($host = www.kavten.com) {
            return 301 https://kavten.com$request_uri;
        }

        # Never let a spoofed client value reach the app's middleware internals.
        proxy_set_header x-middleware-subrequest "";

        # Next.js should not receive upgrade requests on this path.
        if ($http_upgrade ~* websocket) {
            return 400;
        }

        # No security headers here on purpose: the Next.js app already sends
        # CSP, Permissions-Policy, Referrer-Policy, HSTS, nosniff and
        # X-Frame-Options. Adding them again produces duplicate headers.

        # Immutable build assets: cache hard, but keep the upstream headers
        # (including Content-Encoding: br) intact.
        location /_next/static/ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering on;
            # The app already sends "public, max-age=31536000, immutable"; do not
            # append a second Cache-Control here.
            access_log off;
        }

        # SEO files must always be fresh. No Content-Type override: the app
        # already sends the right one and a second header breaks XML parsing.
        location = /robots.txt {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        location ~ ^/sitemap[^/]*\.xml$ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        # Sitemap children live under /sitemap-products/<n>.xml.
        location ~ ^/sitemap-products/ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        location /api/ {
            proxy_pass http://kavten_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite instead of appending so rate limiting cannot be spoofed.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            # CORS is owned by backend/middleware/cors.go; a wildcard here would
            # break credentialed requests.
            add_header Cache-Control "no-store" always;
        }

        location = /health {
            proxy_pass http://kavten_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            access_log off;
        }

        # Documents: let the app decide caching, but never rewrite redirects.
        location / {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # A 308 from the app must reach the browser exactly as issued
            # (/products/old-slug -> /products/new-slug), not be rewritten to
            # this upstream's address.
            proxy_redirect off;
            proxy_buffering on;
            proxy_read_timeout 60s;
        }
    }
}
