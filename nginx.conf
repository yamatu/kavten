# Host-level nginx for kavten.com (bare metal / VPS, TLS terminated here).
# For the containerised variant use docker/nginx.conf (`--profile internal-nginx`).
#
# Canonical host is the apex, kavten.com: that is what every page emits in
# <link rel="canonical"> and in sitemap.xml, so both www and plain http must
# redirect to https://kavten.com in a single hop.
#
# Compression is owned by the app (frontend/brotli-proxy.mjs emits br, then gzip).
# gzip stays off here so responses are neither compressed twice nor stripped of
# their upstream Content-Encoding.
#
# Certificate paths follow the acme.sh layout used on this host:
#   acme.sh --issue -d kavten.com -d www.kavten.com --webroot /var/www/acme
# Replace the two ssl_certificate paths if you terminate TLS elsewhere.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 1100m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # The application compresses; see the header comment.
    gzip off;

    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream kavten_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream kavten_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    # --- HTTP: ACME challenge, then one-hop redirect to the canonical URL ---
    server {
        listen 80;
        listen [::]:80;
        server_name kavten.com www.kavten.com;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://kavten.com$request_uri;
        }
    }

    # --- HTTPS canonical host ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name kavten.com;

        ssl_certificate     /root/.acme.sh/kavten.com_ecc/fullchain.cer;
        ssl_certificate_key /root/.acme.sh/kavten.com_ecc/kavten.com.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Never let a spoofed client value reach the app's middleware internals.
        proxy_set_header x-middleware-subrequest "";

        if ($http_upgrade ~* websocket) {
            return 400;
        }

        # Immutable build assets. The app already sends the immutable
        # Cache-Control, and nginx keeps the upstream Content-Encoding: br.
        location /_next/static/ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            access_log off;
        }

        location = /favicon.ico {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            log_not_found off;
        }

        # SEO files: always fresh, never cached, no Content-Type override
        # (a second Content-Type header breaks XML parsing in Search Console).
        location = /robots.txt {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
            log_not_found off;
        }

        location ~ ^/sitemap[^/]*\.xml$ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        location ~ ^/sitemap-products/ {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://kavten_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 2m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://kavten_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite instead of appending: a client-supplied X-Forwarded-For
            # would otherwise be able to spoof rate limiting and audit IPs.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            # CORS is owned by backend/middleware/cors.go.
            add_header Cache-Control "no-store" always;
        }

        location = /health {
            proxy_pass http://kavten_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            proxy_pass http://kavten_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep 308/301 from the app exactly as issued so renamed product
            # URLs (/products/old-slug -> /products/new-slug) reach the crawler
            # unchanged instead of being rewritten to the upstream address.
            proxy_redirect off;
            proxy_buffering on;
            proxy_read_timeout 60s;
        }
    }

    # --- HTTPS on www: one-hop redirect to the apex, keeping the path ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.kavten.com;

        ssl_certificate     /root/.acme.sh/kavten.com_ecc/fullchain.cer;
        ssl_certificate_key /root/.acme.sh/kavten.com_ecc/kavten.com.key;

        return 301 https://kavten.com$request_uri;
    }
}
